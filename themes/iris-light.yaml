# Iris — thème clair

name: iris-light
label: Iris (clair)
description: Fond clair légèrement violacé, accent iris profond.

palette:
  background: "#f7f6fa"
  midground: "#5b4bd4"
  foreground:
    hex: "#1b1926"
    alpha: 1
  noiseOpacity: 0

colors:
  card: "#ffffff"
  cardForeground: "#1b1926"
  popover: "#ffffff"
  popoverForeground: "#1b1926"
  primary: "#5b4bd4"
  primaryForeground: "#ffffff"
  secondary: "#efeef5"
  secondaryForeground: "#514e63"
  muted: "#efeef5"
  mutedForeground: "#8c8a9c"
  accent: "#5b4bd4"
  accentForeground: "#ffffff"
  destructive: "#c03545"
  destructiveForeground: "#ffffff"
  success: "#0a7d0a"
  warning: "#8a5c00"
  border: "#e3e1ec"
  input: "#ffffff"
  ring: "#5b4bd4"

fontSans: "'Schibsted Grotesk', system-ui, sans-serif"
fontMono: "'JetBrains Mono', ui-monospace, monospace"
fontUrl: "https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
baseSize: "14px"
lineHeight: "1.5"
letterSpacing: "0"

radius: "0.8rem"
density: comfortable
layoutVariant: standard

assets:
  bg: "none"

componentStyles:
  card:
    boxShadow: "0 1px 2px rgba(26,24,44,.05), 0 4px 18px rgba(26,24,44,.045)"
  header:
    background: "#ffffff"

customCSS: |
  [data-state="active"][role="tab"],
  .nav-tab-active {
    position: relative;
  }
  [data-state="active"][role="tab"]::after,
  .nav-tab-active::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: -1px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg,#c94f5e,#cf8a1e,#1f9a60,#2f7fd0,#5b4bd4,#9048c9);
  }
