# Iris — light theme

name: iris-light
label: Iris (clair)
description: Fond clair légèrement violacé, accent iris profond.

# midground is the shell's PRIMARY TEXT color (accents come from colors.*)
palette:
  background: "#f7f6fa"
  midground: "#1b1926"
  foreground:
    hex: "#1b1926"
    alpha: 1
  noiseOpacity: 0

colors:
  card: "#ffffff"
  cardForeground: "#1b1926"
  popover: "#ffffff"
  popoverForeground: "#1b1926"
  primary: "#5b4bd4"
  primaryForeground: "#ffffff"
  secondary: "#efeef5"
  secondaryForeground: "#514e63"
  muted: "#efeef5"
  mutedForeground: "#8c8a9c"
  accent: "#5b4bd4"
  accentForeground: "#ffffff"
  destructive: "#c03545"
  destructiveForeground: "#ffffff"
  success: "#0a7d0a"
  warning: "#8a5c00"
  border: "#e3e1ec"
  input: "#ffffff"
  ring: "#5b4bd4"

typography:
  fontSans: "'Schibsted Grotesk', system-ui, sans-serif"
  fontMono: "'JetBrains Mono', ui-monospace, monospace"
  fontUrl: "https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "13.5px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.8rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

componentStyles:
  card:
    boxShadow: "0 1px 2px rgba(26,24,44,.05), 0 4px 18px rgba(26,24,44,.045)"
  header:
    background: "#ffffff"
  sidebar:
    background: "#ffffff"

customCSS: |
  /* The v0.20 shell derives every --color-* token from the palette alone and
     ignores the colors/layout blocks above: force the Iris tokens here. */
  :root:root {
    --color-primary: #5b4bd4 !important;
    --color-primary-foreground: #ffffff !important;
    --color-accent: #5b4bd4 !important;
    --color-accent-foreground: #ffffff !important;
    --color-ring: #5b4bd4 !important;
    --color-destructive: #c03545 !important;
    --color-success: #0a7d0a !important;
    --color-warning: #8a5c00 !important;
    --color-card: #ffffff !important;
    --color-card-foreground: #1b1926 !important;
    --color-popover: #ffffff !important;
    --color-popover-foreground: #1b1926 !important;
    --color-secondary: #efeef5 !important;
    --color-secondary-foreground: #514e63 !important;
    --color-muted: #efeef5 !important;
    --color-muted-foreground: #8c8a9c !important;
    --color-border: rgba(26,24,44,.09) !important;
    --color-input: #ffffff !important;
    --theme-font-mono: 'JetBrains Mono', ui-monospace, monospace !important;
    --theme-line-height: 1.5 !important;
    --theme-radius: .8rem !important;
    --radius: .8rem !important;
  }
  /* Iris signature: thin spectral arc across the top of the shell */
  body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 9999;
    pointer-events: none;
    background: linear-gradient(90deg,#c94f5e,#cf8a1e,#1f9a60,#2f7fd0,#5b4bd4,#9048c9);
    opacity: 0.85;
  }
  /* Desktop: the Iris plugin renders its own grouped nav (overlay slot);
     hide the native flat list but keep the shell header/footer intact. */
  @media (min-width: 861px) {
    /* mockup sidebar width: 240px (w-64 shrinks with the 13.5px base size) */
    #app-sidebar { width: 240px !important; }
    #app-sidebar nav { visibility: hidden; }
    #app-sidebar > div:first-child { visibility: hidden; }
    #app-sidebar [aria-label="Collapse"] { display: none; }
  }
