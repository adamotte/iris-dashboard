# Iris — light theme

name: iris-light
label: Iris (clair)
description: Fond clair légèrement violacé, accent iris profond.

# midground is the shell's PRIMARY TEXT color (accents come from colors.*)
palette:
  background: "#f7f6fa"
  midground: "#1b1926"
  foreground:
    hex: "#1b1926"
    alpha: 1
  noiseOpacity: 0

colors:
  card: "#ffffff"
  cardForeground: "#1b1926"
  popover: "#ffffff"
  popoverForeground: "#1b1926"
  primary: "#5b4bd4"
  primaryForeground: "#ffffff"
  secondary: "#efeef5"
  secondaryForeground: "#514e63"
  muted: "#efeef5"
  mutedForeground: "#8c8a9c"
  accent: "#5b4bd4"
  accentForeground: "#ffffff"
  destructive: "#c03545"
  destructiveForeground: "#ffffff"
  success: "#0a7d0a"
  warning: "#8a5c00"
  border: "#e3e1ec"
  input: "#ffffff"
  ring: "#5b4bd4"

typography:
  fontSans: "'Schibsted Grotesk', system-ui, sans-serif"
  fontMono: "'JetBrains Mono', ui-monospace, monospace"
  fontUrl: "https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "13.5px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.8rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

componentStyles:
  card:
    boxShadow: "0 1px 2px rgba(26,24,44,.05), 0 4px 18px rgba(26,24,44,.045)"
  header:
    background: "#ffffff"
  sidebar:
    background: "#ffffff"

customCSS: |
  /* The v0.20 shell derives every --color-* token from the palette alone and
     ignores the colors/layout blocks above: force the Iris tokens here. */
  :root:root {
    --color-primary: #5b4bd4 !important;
    --color-primary-foreground: #ffffff !important;
    --color-accent: #5b4bd4 !important;
    --color-accent-foreground: #ffffff !important;
    --color-ring: #5b4bd4 !important;
    --color-destructive: #c03545 !important;
    --color-success: #0a7d0a !important;
    --color-warning: #8a5c00 !important;
    --color-card: #ffffff !important;
    --color-card-foreground: #1b1926 !important;
    --color-popover: #ffffff !important;
    --color-popover-foreground: #1b1926 !important;
    --color-secondary: #efeef5 !important;
    --color-secondary-foreground: #514e63 !important;
    --color-muted: #efeef5 !important;
    --color-muted-foreground: #8c8a9c !important;
    --color-border: rgba(26,24,44,.09) !important;
    --color-input: #ffffff !important;
    --theme-font-mono: 'JetBrains Mono', ui-monospace, monospace !important;
    --theme-line-height: 1.5 !important;
    --theme-radius: .8rem !important;
    --radius: .8rem !important;
    /* Iris chart/series + surface tokens (mockup) */
    --iris-series-1: #5b4bd4;
    --iris-series-2: #1baf7a;
    --iris-series-3: #eda100;
    --iris-grid: rgba(26,24,44,.07);
    --iris-hover: rgba(26,24,44,.04);
    --iris-shadow: 0 1px 2px rgba(26,24,44,.05), 0 4px 18px rgba(26,24,44,.045);
    --iris-shadow-pop: 0 12px 40px rgba(26,24,44,.14);
  }
  /* Iris signature: thin spectral arc across the top of the shell */
  body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 9999;
    pointer-events: none;
    background: linear-gradient(90deg,#c94f5e,#cf8a1e,#1f9a60,#2f7fd0,#5b4bd4,#9048c9);
    opacity: 0.85;
  }
  /* Desktop: the Iris plugin renders its own grouped nav (overlay slot);
     hide the native flat list but keep the shell header/footer intact. */
  @media (min-width: 861px) {
    /* mockup sidebar width: 240px (w-64 shrinks with the 13.5px base size) */
    #app-sidebar { width: 240px !important; }
    #app-sidebar nav { visibility: hidden; }
    #app-sidebar > div:first-child { visibility: hidden; }
    #app-sidebar [aria-label="Collapse"] { display: none; }
  }
  /* ---- Iris chat page chrome (native /chat page) ----
     The chat page embeds the real Hermes TUI; the TUI content is painted by
     the CLI skin (skins/iris.yaml, display.skin), so here we only frame the
     pane and rail. `[data-chat-active="true"]` is the persistent chat host;
     the mobile side panel is portaled to <body>, so it stays out of scope. */
  [data-chat-active="true"] div:has(> .hermes-chat-xterm-host) {
    background: var(--color-card, #ffffff) !important;
    box-shadow: var(--iris-shadow-pop, 0 12px 40px rgba(26,24,44,.14)) !important;
  }
  /* spectral accent along the terminal-window top edge */
  [data-chat-active="true"] div:has(> .hermes-chat-xterm-host)::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(90deg,#c94f5e,#cf8a1e,#1f9a60,#2f7fd0,#5b4bd4,#9048c9);
    opacity: .85;
  }
  [data-chat-active="true"] .hermes-chat-xterm-host {
    border: 1px solid var(--color-border, rgba(26,24,44,.09));
    border-radius: calc(var(--radius, .8rem) - 2px);
  }
  /* floating chrome buttons (copy last response / reveal panel) */
  [data-chat-active="true"] button.absolute.z-10 {
    background: rgba(0,0,0,.28) !important;
    border-color: rgba(26,24,44,.12) !important;
    box-shadow: 0 2px 10px rgba(26,24,44,.1);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  [data-chat-active="true"] button.absolute.z-10:hover {
    background: rgba(0,0,0,.42) !important;
    border-color: rgba(26,24,44,.22) !important;
  }
  [data-chat-active="true"] #chat-side-panel {
    background: var(--color-card, #ffffff);
    border: 1px solid var(--color-border, rgba(26,24,44,.09));
    border-radius: var(--radius, .8rem);
    padding: 10px;
  }
  /* rail header separator (collapse row) */
  [data-chat-active="true"] #chat-side-panel > div:first-child {
    border-bottom: 1px solid var(--color-border, rgba(26,24,44,.09));
    margin-bottom: 4px;
  }
