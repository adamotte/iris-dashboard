# Iris — dark theme
# Palette validated for contrast and color-blindness. Drop into
# ~/.hermes/dashboard-themes/ then select it via the dashboard palette icon.

name: iris-dark
label: Iris (sombre)
description: Base violacée profonde, accent iris, arc spectral discret.

# midground is the shell's PRIMARY TEXT color (accents come from colors.*)
palette:
  background: "#0f0e15"
  midground: "#f0eff7"
  foreground:
    hex: "#f0eff7"
    alpha: 1
  noiseOpacity: 0

# colorOverrides: the v0.21 first-class mechanism. Each key maps 1:1 to the
# --color-<kebab> CSS var and wins over the palette cascade for this theme.
colorOverrides:
  card: "#16151d"
  cardForeground: "#f0eff7"
  popover: "#1d1c26"
  popoverForeground: "#f0eff7"
  primary: "#8b80f9"
  primaryForeground: "#0f0e15"
  secondary: "#1d1c26"
  secondaryForeground: "#aaa8bb"
  muted: "#1d1c26"
  mutedForeground: "#8c8a9c"
  accent: "#8b80f9"
  accentForeground: "#0f0e15"
  destructive: "#e05a6b"
  destructiveForeground: "#f0eff7"
  success: "#22b573"
  warning: "#fab219"
  border: "rgba(255,255,255,.07)"
  input: "#1d1c26"
  ring: "#8b80f9"

typography:
  fontSans: "'Schibsted Grotesk', system-ui, sans-serif"
  fontMono: "'JetBrains Mono', ui-monospace, monospace"
  fontUrl: "https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "13.5px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.8rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

componentStyles:
  card:
    boxShadow: "none"
  header:
    background: "#16151d"
  sidebar:
    background: "#16151d"

customCSS: |
  /* Colors now come from colorOverrides: (v0.21 first-class mechanism).
     customCSS keeps only Iris-specific chrome the YAML cannot express:
     fonts, the spectral arc, the grouped-nav sidebar and the chat page. */
  :root:root {
    --theme-font-mono: 'JetBrains Mono', ui-monospace, monospace !important;
    /* Iris chart/series + surface tokens (mockup) */
    --iris-series-1: #7668e8;
    --iris-series-2: #199e70;
    --iris-series-3: #c98500;
    --iris-grid: rgba(255,255,255,.06);
    --iris-hover: rgba(255,255,255,.045);
    --iris-shadow: none;
    --iris-shadow-pop: 0 8px 32px rgba(0,0,0,.45);
  }
  /* Iris signature: thin spectral arc across the top of the shell */
  body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 9999;
    pointer-events: none;
    background: linear-gradient(90deg,#e05a6b,#e8a13c,#2fae72,#3f8fdf,#7668e8,#a75ce0);
    opacity: 0.75;
  }
  /* Desktop: the Iris plugin renders its own grouped nav (overlay slot);
     hide the native flat list but keep the shell header/footer intact.
     On mobile the native drawer keeps the flat nav. */
  @media (min-width: 861px) {
    /* mockup sidebar width: 240px (w-64 shrinks with the 13.5px base size) */
    #app-sidebar { width: 240px !important; }
    #app-sidebar nav { visibility: hidden; }
    #app-sidebar > div:first-child { visibility: hidden; }
    #app-sidebar [aria-label="Collapse"] { display: none; }
  }
  /* ---- Iris chat page chrome (native /chat page) ----
     The chat page embeds the real Hermes TUI; the TUI content is painted by
     the CLI skin (skins/iris.yaml, display.skin), so here we only frame the
     pane and rail. `[data-chat-active="true"]` is the persistent chat host;
     the mobile side panel is portaled to <body>, so it stays out of scope. */
  [data-chat-active="true"] div:has(> .hermes-chat-xterm-host) {
    background: var(--color-card, #16151d) !important;
    box-shadow: var(--iris-shadow-pop, 0 8px 32px rgba(0,0,0,.45)) !important;
  }
  /* spectral accent along the terminal-window top edge */
  [data-chat-active="true"] div:has(> .hermes-chat-xterm-host)::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(90deg,#e05a6b,#e8a13c,#2fae72,#3f8fdf,#7668e8,#a75ce0);
    opacity: .8;
  }
  [data-chat-active="true"] .hermes-chat-xterm-host {
    border: 1px solid var(--color-border, rgba(255,255,255,.07));
    border-radius: calc(var(--radius, .8rem) - 2px);
  }
  /* floating chrome buttons (copy last response / reveal panel) */
  [data-chat-active="true"] button.absolute.z-10 {
    background: rgba(0,0,0,.5) !important;
    border-color: rgba(255,255,255,.12) !important;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  [data-chat-active="true"] button.absolute.z-10:hover {
    background: rgba(0,0,0,.68) !important;
    border-color: rgba(255,255,255,.24) !important;
  }
  [data-chat-active="true"] #chat-side-panel {
    background: var(--color-card, #16151d);
    border: 1px solid var(--color-border, rgba(255,255,255,.07));
    border-radius: var(--radius, .8rem);
    padding: 10px;
  }
  /* rail header separator (collapse row) */
  [data-chat-active="true"] #chat-side-panel > div:first-child {
    border-bottom: 1px solid var(--color-border, rgba(255,255,255,.07));
    margin-bottom: 4px;
  }
  /* rail content — Iris section labels ("model", sessions) */
  [data-chat-active="true"] #chat-side-panel .text-display {
    font-size: 10.5px !important;
    font-weight: 650 !important;
    letter-spacing: .09em !important;
    text-transform: uppercase !important;
    color: var(--color-primary, #8b80f9) !important;
  }
  /* rail cards (model picker) lift off the panel background */
  [data-chat-active="true"] #chat-side-panel div[class*="bg-card"] {
    background: var(--color-popover, #1d1c26) !important;
    border: 1px solid var(--color-border, rgba(255,255,255,.07)) !important;
    border-radius: calc(var(--radius, .8rem) - 3px) !important;
  }
  /* new chat button — Iris outline */
  [data-chat-active="true"] #chat-side-panel button[class*="justify-center"] {
    border-color: var(--color-primary, #8b80f9) !important;
    color: var(--color-primary, #8b80f9) !important;
    background: transparent !important;
    border-radius: calc(var(--radius, .8rem) - 4px) !important;
  }
  [data-chat-active="true"] #chat-side-panel button[class*="justify-center"]:hover {
    background: color-mix(in srgb, var(--color-primary, #8b80f9) 12%, transparent) !important;
  }
  /* active session row — iris accent tint */
  [data-chat-active="true"] #chat-side-panel [aria-current="true"] {
    background: color-mix(in srgb, var(--color-primary, #8b80f9) 14%, transparent) !important;
    border-left-color: var(--color-primary, #8b80f9) !important;
  }
